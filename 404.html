<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>SIGNAL LOST — AYNENKI</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%2316161D'/%3E%3Ctext x='32' y='45' font-size='38' text-anchor='middle' fill='%23C9A050'%3E%E2%9D%96%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=VT323&display=swap" rel="stylesheet">
<style>
  :root {
    --void: #16161D;
    --gold: #C9A050;
    --gold-bright: #d8b568;
    --gold-pale: #EDE0C0;
    --vellum: #c5b58a;
    --violet: #a060e0;
    --bad: #d4796c;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    display: flex; align-items: center; justify-content: center;
    background:
      repeating-linear-gradient(0deg, rgba(201, 160, 80, 0.04) 0 1px, transparent 1px 3px),
      radial-gradient(ellipse at 50% 40%, #14121c 0%, #0d0d12 75%);
    color: var(--gold-pale);
    font-family: 'VT323', 'Courier New', monospace;
    overflow: hidden;
  }
  /* drifting static, same family as the boot screen */
  .static {
    position: fixed; inset: -10%; pointer-events: none; opacity: 0.05;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/></filter><rect width='100%' height='100%' filter='url(%23n)' opacity='1'/></svg>");
    animation: staticJump 0.3s steps(4) infinite;
  }
  @keyframes staticJump {
    0% { transform: translate(0, 0); }
    50% { transform: translate(-1.5%, 1%); }
    100% { transform: translate(1%, -1.5%); }
  }
  .wrap { width: min(640px, 88vw); position: relative; }
  h1 {
    font-family: 'Black Ops One', sans-serif;
    font-size: clamp(1.6rem, 5.5vw, 2.8rem);
    letter-spacing: 0.3em;
    color: var(--bad);
    text-shadow: 0 0 22px rgba(212, 121, 108, 0.5),
      -2px 0 0 rgba(160, 96, 224, 0.3), 2px 0 0 rgba(122, 96, 48, 0.4);
    animation: lostFlicker 3.2s steps(1) infinite;
    margin-bottom: 1.6rem;
  }
  @keyframes lostFlicker {
    0%, 100% { opacity: 1; }
    44% { opacity: 1; } 45% { opacity: 0.55; } 46% { opacity: 1; }
    71% { opacity: 1; } 72% { opacity: 0.7; } 74% { opacity: 1; }
  }
  pre {
    font-family: inherit;
    font-size: clamp(1rem, 2.4vw, 1.25rem); line-height: 2;
    letter-spacing: 0.12em;
    color: var(--gold-pale);
    text-shadow: 0 0 8px rgba(201, 160, 80, 0.4);
    white-space: pre-wrap;
    min-height: 8em;
  }
  pre .err { color: var(--bad); }
  pre .cursor { color: var(--gold-bright); animation: blink 0.85s steps(1) infinite; }
  @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
  .home {
    display: inline-block; margin-top: 1.8rem;
    padding: 0.8rem 1.6rem;
    font-family: 'Black Ops One', sans-serif;
    font-size: 0.8rem; letter-spacing: 0.22em; text-transform: uppercase;
    color: var(--gold-pale); text-decoration: none;
    border: 1px solid rgba(201, 160, 80, 0.5);
    background: linear-gradient(180deg, rgba(74, 58, 28, 0.35), rgba(22, 22, 29, 0.6));
    position: relative;
    transition: all 0.25s;
    opacity: 0; animation: rise 0.6s ease 2.4s forwards;
  }
  @keyframes rise { to { opacity: 1; } }
  .home::before, .home::after {
    content: ''; position: absolute; width: 9px; height: 9px; border: 1px solid var(--gold);
  }
  .home::before { top: -4px; left: -4px; border-right: none; border-bottom: none; }
  .home::after { bottom: -4px; right: -4px; border-left: none; border-top: none; }
  .home:hover {
    border-color: var(--gold-bright);
    box-shadow: 0 0 24px rgba(201, 160, 80, 0.4);
    transform: translateY(-2px);
  }
  @media (prefers-reduced-motion: reduce) {
    .static, h1 { animation: none; }
    .home { opacity: 1; animation: none; }
  }
</style>
</head>
<body>
  <div class="static" aria-hidden="true"></div>
  <div class="wrap">
    <h1>SIGNAL LOST</h1>
    <pre id="log" aria-live="polite"></pre>
    <a class="home" id="homeLink" href="/">&#10070; Return to the Order</a>
  </div>
<script>
  /* GitHub Pages project sites live under /<repo>/ — point home there.
     On a custom domain (or local files) plain "/" is correct. */
  (function fixHomeLink(){
    var seg = location.pathname.split('/')[1];
    if (/\.github\.io$/.test(location.hostname) && seg) {
      document.getElementById('homeLink').href = '/' + seg + '/';
    }
  })();
  /* typed diagnostic log, same cadence as the boot screen */
  (function typeLog(){
    var LINES = [
      ['CHANNEL ............ ', 'NOT FOUND', 'err'],
      ['SWEEPING VEILS ..... ', 'NO TRACE', 'err'],
      ['THE EYE SEARCHES ... ', 'NOTHING HERE', 'err'],
      ['RECOMMEND .......... ', 'RETURN TO THE ORDER', '']
    ];
    var log = document.getElementById('log');
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
      log.textContent = LINES.map(function(l){ return l[0] + l[1]; }).join('\n');
      return;
    }
    var cur = document.createElement('span');
    cur.className = 'cursor';
    cur.textContent = '▌';
    log.appendChild(cur);
    var li = 0, ci = 0, lineSpan = null;
    (function tick(){
      if (li >= LINES.length) { setTimeout(function(){ cur.remove(); }, 2600); return; }
      var prefix = LINES[li][0], status = LINES[li][1], cls = LINES[li][2];
      if (!lineSpan) { lineSpan = document.createElement('span'); cur.before(lineSpan); }
      if (ci < prefix.length) {
        lineSpan.append(prefix.charAt(ci++));
        setTimeout(tick, 8 + Math.random() * 10);
      } else {
        if (status) {
          var st = document.createElement('span');
          if (cls) st.className = cls;
          st.textContent = status;
          cur.before(st);
        }
        cur.before(document.createTextNode('\n'));
        lineSpan = null; ci = 0; li++;
        setTimeout(tick, 120 + Math.random() * 140);
      }
    })();
  })();
</script>
</body>
</html>
