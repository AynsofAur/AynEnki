<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#16161D" />
<meta name="color-scheme" content="dark" />
<title id="metaTitle">MALIKEYE — The Watcher Streams</title>
<meta id="metaDesc" name="description" content="Malikeye — live streams, portfolio, shop. The eye is open.">
<meta id="metaOg" property="og:image" content="">
<meta property="og:type" content="website">
<meta property="og:title" content="MALIKEYE">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Cinzel:wght@400;600;900&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  /* ===== REVERIE PALETTE ===== */
  :root {
    /* core five */
    --void: #16161D;
    --dusk: #2A2535;
    --amber-mist: #7A6030;
    --reverie: #C9A050;
    --moonspill: #EDE0C0;

    /* legacy aliases (so existing CSS keeps working) */
    --black: #16161D;
    --black-2: #2A2535;
    --ink-deep: #0d0d12;
    --panel: rgba(42, 37, 53, 0.45);
    --panel-solid: #2A2535;
    --border: rgba(201, 160, 80, 0.22);
    --border-strong: rgba(201, 160, 80, 0.55);
    --red: #7A6030;
    --red-deep: #4a3a1c;
    --red-glow: #C9A050;
    --gold: #C9A050;
    --gold-bright: #d8b568;
    --gold-pale: #EDE0C0;
    --vellum: #c5b58a;
    --muted: #7A6030;
    --good: #b0c97a;
    --warn: #C9A050;
    --bad: #d4796c;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%;
    background: var(--black);
    color: var(--gold-pale);
    font-family: 'Cormorant Garamond', Georgia, serif;
    min-height: 100vh;
    overflow-x: hidden;
  }
  html { scroll-behavior: smooth; }

  /* ===== GLOBAL BACKGROUND LAYERS ===== */
  .bg-base {
    position: fixed; inset: 0; z-index: -3;
    background: radial-gradient(ellipse at center, #1a1825 0%, #16161D 60%, #000 100%);
  }
  .bg-base::before {
    content: ''; position: absolute; inset: 0;
    background:
      repeating-linear-gradient(0deg, rgba(201, 160, 80, 0.03) 0 1px, transparent 1px 4px),
      repeating-linear-gradient(90deg, rgba(201, 160, 80, 0.03) 0 1px, transparent 1px 4px);
    mix-blend-mode: overlay;
  }
  .bg-grain {
    position: fixed; inset: -50%; z-index: -2; pointer-events: none; opacity: 0.05;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/><feDisplacementMap in='SourceGraphic' scale='80'/></filter><rect width='200' height='200' filter='url(%23n)'/></svg>");
    animation: grain 1.4s steps(6) infinite;
  }
  @keyframes grain {
    0% { transform: translate(0, 0); }
    50% { transform: translate(-2%, 2%); }
    100% { transform: translate(0, 0); }
  }
  .bg-vignette {
    position: fixed; inset: 0; z-index: -1; pointer-events: none;
    background: radial-gradient(ellipse at center, transparent 55%, rgba(0, 0, 0, 0.7) 100%);
  }

  /* ===== NAV ===== */
  .nav {
    position: sticky; top: 0; z-index: 50;
    display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap;
    column-gap: 1.5rem; row-gap: 0.5rem;
    padding: 0.9rem clamp(1rem, 3vw, 2.5rem);
    background: linear-gradient(180deg, rgba(22, 22, 29, 0.92), rgba(22, 22, 29, 0.5) 80%, transparent);
    border-bottom: 1px solid rgba(201, 160, 80, 0.15);
    backdrop-filter: blur(10px);
  }
  .nav.hidden { display: none; }
  .brand {
    font-family: 'Cinzel Decorative', serif;
    font-weight: 900;
    letter-spacing: 0.32em;
    color: var(--gold-bright);
    font-size: clamp(0.9rem, 1.3vw, 1.1rem);
    text-shadow: 0 0 12px rgba(201, 160, 80, 0.4);
    white-space: nowrap;
    cursor: pointer;
    user-select: none;
  }
  .brand::before { content: '\2756 '; color: var(--gold); margin-right: 6px; }
  .tabs { display: flex; flex-wrap: wrap; column-gap: clamp(0.6rem, 1.4vw, 1.4rem); row-gap: 0.3rem; }
  .tab {
    background: transparent; border: none;
    color: var(--gold-pale);
    text-decoration: none;
    font-family: 'Cinzel', serif;
    font-size: clamp(0.7rem, 0.9vw, 0.82rem);
    letter-spacing: 0.22em;
    text-transform: uppercase;
    white-space: nowrap;
    padding: 6px 4px;
    cursor: pointer;
    transition: color 0.2s, text-shadow 0.2s;
  }
  .tab:hover { color: var(--gold-bright); text-shadow: 0 0 8px var(--red-glow); }
  .tab.active { color: var(--gold-bright); text-shadow: 0 0 12px var(--red-glow); }
  .tab.admin-tab { color: var(--red-glow); }
  .tab.admin-tab:hover { color: var(--gold-bright); }

  /* ===== VIEW SYSTEM ===== */
  .view { display: none; padding: 4rem 2rem; min-height: calc(100vh - 65px); position: relative; }
  .view.active { display: block; }
  .view.fullscreen-view {
    padding: 0;
    position: fixed; inset: 0; z-index: 100;
    background: var(--black);
    overflow: hidden;
    min-height: 100vh;
  }
  .view.fullscreen-view.active { display: block; }
  .container { max-width: 1100px; margin: 0 auto; }

  /* ===== ORNATE ELEMENTS (shared) ===== */
  .ornate {
    display: flex; align-items: center; justify-content: center;
    gap: 1rem; color: var(--gold);
  }
  .ornate hr {
    flex: 0 1 14rem; border: none; height: 1px;
    background: linear-gradient(90deg, transparent, #C9A050, transparent);
  }
  .ornate span {
    font-size: 1.1rem; color: var(--gold-bright);
    text-shadow: 0 0 8px var(--red-glow);
  }
  .hero-glyph:hover {
    color: var(--moonspill);
    text-shadow: 0 0 14px rgba(237, 224, 192, 0.5);
  }

  /* corner brackets (used on cards and modal) */
  .corners { position: relative; }
  .corners::before, .corners::after {
    content: ''; position: absolute;
    width: 10px; height: 10px; border: 1px solid var(--gold);
  }
  .corners::before { top: -5px; left: -5px; border-right: none; border-bottom: none; }
  .corners::after { bottom: -5px; right: -5px; border-left: none; border-top: none; }

  /* large corner ornaments (used on fullscreen overlays) */
  .corner-orn { position: fixed; width: 140px; height: 140px; z-index: 9; opacity: 0.6; pointer-events: none; }
  .corner-orn svg { width: 100%; height: 100%; fill: none; stroke: var(--gold); stroke-width: 1.2; filter: drop-shadow(0 0 4px var(--red-glow)); }
  .corner-orn.tl { top: 24px; left: 24px; }
  .corner-orn.tr { top: 24px; right: 24px; transform: scaleX(-1); }
  .corner-orn.bl { bottom: 24px; left: 24px; transform: scaleY(-1); }
  .corner-orn.br { bottom: 24px; right: 24px; transform: scale(-1, -1); }

  /* ===== HERO (home) ===== */
  .hero {
    min-height: 88vh;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 2rem 2rem 3rem; position: relative;
  }
  .hero .eye-hero {
    width: min(46vh, 380px); height: min(46vh, 380px);
    filter: drop-shadow(0 0 30px rgba(201, 160, 80, 0.55)) drop-shadow(0 0 60px rgba(201, 160, 80, 0.25));
    animation: floaty 6s ease-in-out infinite;
  }
  @keyframes floaty { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
  .hero h1 {
    margin-top: 2rem;
    font-family: 'Cinzel Decorative', serif;
    font-weight: 900;
    letter-spacing: 0.22em;
    font-size: clamp(2.4rem, 6.5vw, 5.5rem);
    background: linear-gradient(180deg, #EDE0C0 0%, #C9A050 45%, #7A6030 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    text-shadow: 0 0 30px rgba(201, 160, 80, 0.25);
    animation: flicker 6s ease-in-out infinite;
  }
  @keyframes flicker {
    0%, 100% { opacity: 1; } 47% { opacity: 1; }
    48% { opacity: 0.65; } 49% { opacity: 1; }
    72% { opacity: 1; } 73% { opacity: 0.8; } 74% { opacity: 1; }
  }
  .hero .ornate { margin: 1rem 0; }
  .hero .tagline {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    color: var(--vellum);
    letter-spacing: 0.32em;
    text-transform: uppercase;
    font-size: clamp(0.85rem, 1.3vw, 1.15rem);
  }
  .hero-actions {
    margin-top: 2.5rem; display: flex; flex-wrap: wrap; justify-content: center;
    column-gap: clamp(0.8rem, 1.5vw, 1.2rem); row-gap: 0.8rem;
  }

  /* ===== BUTTONS ===== */
  .btn {
    display: inline-flex; align-items: center; gap: 0.55rem;
    padding: 0.85rem 1.5rem;
    border: 1px solid rgba(201, 160, 80, 0.5);
    background: linear-gradient(180deg, rgba(74, 58, 28, 0.35), rgba(22, 22, 29, 0.6));
    color: var(--gold-pale);
    font-family: 'Cinzel', serif;
    letter-spacing: 0.2em;
    font-size: clamp(0.72rem, 0.9vw, 0.82rem);
    text-decoration: none; text-transform: uppercase; white-space: nowrap;
    box-shadow: 0 0 20px rgba(201, 160, 80, 0.12) inset;
    transition: all 0.25s; position: relative; cursor: pointer;
    border-radius: 0;
  }
  .btn::before, .btn::after {
    content: ''; position: absolute; width: 9px; height: 9px; border: 1px solid var(--gold);
  }
  .btn::before { top: -4px; left: -4px; border-right: none; border-bottom: none; }
  .btn::after { bottom: -4px; right: -4px; border-left: none; border-top: none; }
  .btn:hover {
    background: linear-gradient(180deg, rgba(201, 160, 80, 0.5), rgba(22, 22, 29, 0.7));
    color: var(--gold-pale);
    box-shadow: 0 0 24px rgba(201, 160, 80, 0.45);
  }
  .btn.primary {
    background: linear-gradient(180deg, rgba(201, 160, 80, 0.55), rgba(74, 58, 28, 0.7));
    color: var(--gold-pale);
  }
  .btn.ghost {
    background: transparent;
    border-color: rgba(201, 160, 80, 0.3);
    color: var(--vellum);
  }
  .btn.ghost::before, .btn.ghost::after { display: none; }
  .btn.ghost:hover { border-color: var(--gold-bright); color: var(--gold-bright); box-shadow: none; }
  .btn.danger { color: var(--red-glow); border-color: var(--red-deep); }
  .btn.danger:hover { background: rgba(74, 58, 28, 0.5); color: var(--gold-pale); }
  .btn.small { padding: 0.5rem 1rem; font-size: 0.7rem; }
  .btn svg { width: 1em; height: 1em; fill: currentColor; }

  /* ===== SECTION (generic) ===== */
  .section-block {
    max-width: 1100px; margin: 0 auto; padding: 4rem 1.5rem;
  }
  .section-block h2 {
    font-family: 'Cinzel Decorative', serif; font-weight: 900;
    letter-spacing: 0.18em;
    font-size: clamp(1.8rem, 3.5vw, 2.6rem);
    text-align: center;
    background: linear-gradient(180deg, #EDE0C0 0%, #C9A050 50%, #7A6030 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .section-block .lead {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.1rem; line-height: 1.8; color: var(--vellum);
    max-width: 720px; margin: 1.4rem auto; text-align: center;
  }

  /* ===== FEATURED / PIECE GRID ===== */
  .piece-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 1.8rem; margin-top: 2.5rem;
  }
  .piece {
    background: linear-gradient(180deg, rgba(74, 58, 28, 0.15), rgba(22, 22, 29, 0.55));
    border: 1px solid rgba(201, 160, 80, 0.3);
    overflow: hidden; cursor: pointer;
    transition: all 0.25s; position: relative;
    display: flex; flex-direction: column;
  }
  .piece::before, .piece::after {
    content: ''; position: absolute; width: 10px; height: 10px; border: 1px solid var(--gold);
  }
  .piece::before { top: -5px; left: -5px; border-right: none; border-bottom: none; }
  .piece::after { bottom: -5px; right: -5px; border-left: none; border-top: none; }
  .piece:hover {
    border-color: rgba(201, 160, 80, 0.7);
    transform: translateY(-3px);
    box-shadow: 0 8px 28px rgba(201, 160, 80, 0.18);
  }
  .piece.featured-flag .featured-badge {
    position: absolute; top: 12px; left: 12px; z-index: 2;
    background: rgba(22, 22, 29, 0.85);
    color: var(--gold-bright);
    padding: 3px 10px;
    font-family: 'Cinzel', serif;
    font-size: 9px; letter-spacing: 3px;
    border: 1px solid var(--gold);
    text-shadow: 0 0 4px var(--red-glow);
  }
  .piece-thumb {
    width: 100%; aspect-ratio: 4/3;
    background: linear-gradient(135deg, var(--red-deep), var(--black-2));
    position: relative; overflow: hidden;
    display: flex; align-items: center; justify-content: center;
  }
  .piece-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .piece-thumb .glyph {
    font-family: 'Cinzel Decorative', serif;
    font-weight: 900;
    font-size: 56px;
    color: rgba(237, 224, 192, 0.4);
    letter-spacing: 6px;
  }
  .piece-thumb::after {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(180deg, transparent 50%, rgba(22, 22, 29, 0.6));
  }
  .piece-body { padding: 1.3rem 1.4rem 1.4rem; flex: 1; display: flex; flex-direction: column; }
  .piece-title {
    font-family: 'Cinzel', serif; font-weight: 600;
    letter-spacing: 0.18em;
    color: var(--gold-bright);
    font-size: 1rem; text-transform: uppercase;
    margin: 0 0 0.6rem;
  }
  .piece-desc {
    color: var(--vellum); font-family: 'Cormorant Garamond', serif;
    font-size: 1rem; line-height: 1.6; margin: 0; flex: 1;
  }
  .piece-footer {
    margin-top: 1rem; padding-top: 0.9rem;
    border-top: 1px solid rgba(201, 160, 80, 0.15);
    display: flex; align-items: center; justify-content: space-between;
  }
  .price {
    font-family: 'Cinzel', serif; font-weight: 900;
    color: var(--gold-bright);
    font-size: 1.05rem; letter-spacing: 0.08em;
  }
  .piece-tag {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px; color: var(--red-glow);
    letter-spacing: 0.22em; text-transform: uppercase;
  }

  /* ===== FILTER CHIPS ===== */
  .filter-bar { display: flex; gap: 8px; flex-wrap: wrap; margin: 1.5rem 0 0; }
  .chip {
    background: transparent;
    color: var(--vellum);
    border: 1px solid var(--border);
    padding: 6px 14px;
    font-family: 'Cinzel', serif;
    font-size: 10px; letter-spacing: 0.2em;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.2s;
  }
  .chip:hover { color: var(--gold-bright); border-color: var(--border-strong); }
  .chip.active {
    color: var(--gold-bright); border-color: var(--gold-bright);
    background: rgba(201, 160, 80, 0.08);
  }

  /* ===== SCHEDULE TABLE ===== */
  .schedule-table {
    margin-top: 2rem;
    background: linear-gradient(180deg, rgba(74, 58, 28, 0.15), rgba(22, 22, 29, 0.5));
    border: 1px solid rgba(201, 160, 80, 0.3);
    position: relative;
  }
  .schedule-table::before, .schedule-table::after {
    content: ''; position: absolute; width: 12px; height: 12px; border: 1px solid var(--gold);
  }
  .schedule-table::before { top: -6px; left: -6px; border-right: none; border-bottom: none; }
  .schedule-table::after { bottom: -6px; right: -6px; border-left: none; border-top: none; }
  .schedule-table table { width: 100%; border-collapse: collapse; }
  .schedule-table th, .schedule-table td {
    padding: 1rem 1.4rem; text-align: left;
    border-bottom: 1px solid rgba(201, 160, 80, 0.12);
    font-family: 'Cinzel', serif;
    letter-spacing: 0.12em;
    font-size: 0.92rem;
  }
  .schedule-table th {
    color: var(--gold-bright);
    text-transform: uppercase;
    letter-spacing: 0.22em;
    font-size: 0.78rem;
    background: linear-gradient(180deg, rgba(74, 58, 28, 0.4), rgba(22, 22, 29, 0.4));
  }
  .schedule-table td.day { color: var(--gold-bright); text-shadow: 0 0 8px rgba(201, 160, 80, 0.3); }
  .schedule-table td.title { font-family: 'Cormorant Garamond', serif; font-style: italic; color: var(--gold-pale); font-size: 1.05rem; }
  .schedule-table td.time { color: var(--vellum); font-size: 0.88rem; }
  .schedule-table tr:last-child td { border-bottom: 0; }

  /* ===== SOCIAL GRID ===== */
  .social-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 1.1rem; margin-top: 2.2rem;
  }
  .social-grid a {
    padding: 1.3rem; display: flex; align-items: center; gap: 1rem;
    text-decoration: none; color: var(--gold-pale);
    border: 1px solid rgba(201, 160, 80, 0.3);
    background: linear-gradient(180deg, rgba(74, 58, 28, 0.15), rgba(22, 22, 29, 0.5));
    transition: all 0.25s; position: relative;
  }
  .social-grid a::before, .social-grid a::after {
    content: ''; position: absolute; width: 8px; height: 8px; border: 1px solid var(--gold);
  }
  .social-grid a::before { top: -4px; left: -4px; border-right: none; border-bottom: none; }
  .social-grid a::after { bottom: -4px; right: -4px; border-left: none; border-top: none; }
  .social-grid a:hover {
    border-color: var(--gold-bright);
    background: linear-gradient(180deg, rgba(201, 160, 80, 0.3), rgba(22, 22, 29, 0.5));
  }
  .social-grid svg { width: 1.7rem; height: 1.7rem; fill: var(--gold); filter: drop-shadow(0 0 4px var(--red-glow)); }
  .social-grid .name {
    font-family: 'Cinzel', serif; letter-spacing: 0.18em;
    font-size: 0.8rem; color: var(--gold-bright);
    text-transform: uppercase;
  }
  .social-grid .handle {
    font-family: 'Cormorant Garamond', serif;
    font-size: 0.98rem; color: var(--vellum);
  }

  /* ===== DETAIL MODAL ===== */
  .detail-backdrop {
    display: none; position: fixed; inset: 0;
    background: rgba(0, 0, 0, 0.92); backdrop-filter: blur(12px);
    z-index: 150; overflow-y: auto; padding: 40px 20px;
  }
  .detail-backdrop.active { display: block; }
  .detail-modal {
    max-width: 1100px; margin: 0 auto;
    background: var(--panel-solid);
    border: 1px solid var(--border-strong);
    overflow: hidden;
    position: relative;
  }
  .detail-modal::before, .detail-modal::after {
    content: ''; position: absolute; width: 16px; height: 16px; border: 1px solid var(--gold);
  }
  .detail-modal::before { top: -8px; left: -8px; border-right: none; border-bottom: none; }
  .detail-modal::after { bottom: -8px; right: -8px; border-left: none; border-top: none; }
  .detail-close {
    position: absolute; top: 50px; right: 50px;
    width: 44px; height: 44px;
    background: rgba(22, 22, 29, 0.9); border: 1px solid var(--border);
    color: var(--gold-pale); font-size: 22px; cursor: pointer;
    z-index: 160; font-family: serif;
  }
  .detail-close:hover { color: var(--red-glow); border-color: var(--red-glow); }
  .detail-viewer { width: 100%; aspect-ratio: 16/10; background: #000; position: relative; overflow: hidden; }
  .detail-viewer model-viewer, .detail-viewer iframe, .detail-viewer img, .detail-viewer video { width: 100%; height: 100%; border: 0; display: block; }
  .detail-viewer img { object-fit: contain; }
  .detail-viewer video { object-fit: contain; background: #000; }
  .detail-body { padding: 2rem 2.5rem 2.5rem; }
  .detail-body h2 {
    font-family: 'Cinzel Decorative', serif; font-weight: 900;
    font-size: clamp(1.6rem, 3vw, 2.2rem);
    letter-spacing: 0.18em;
    background: linear-gradient(180deg, #EDE0C0, #C9A050 60%, #7A6030);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    margin: 0 0 0.5rem;
  }
  .detail-body .meta {
    display: flex; gap: 1rem; align-items: center;
    color: var(--vellum);
    font-family: 'Cinzel', serif; letter-spacing: 0.18em;
    text-transform: uppercase; font-size: 0.8rem;
    margin-bottom: 1.4rem;
  }
  .detail-body .meta .price { font-size: 1.3rem; }
  .detail-body p {
    color: var(--gold-pale);
    font-family: 'Cormorant Garamond', serif;
    line-height: 1.85; font-size: 1.08rem;
    margin: 0 0 1.5rem;
  }

  /* ===== COMMISSIONS ===== */
  .commissions-wrap { max-width: 880px; margin: 0 auto; }
  .status-badge {
    display: inline-flex; align-items: center; gap: 10px;
    padding: 10px 22px;
    border: 1px solid var(--good); color: var(--good);
    font-family: 'Cinzel', serif;
    font-size: 11px; letter-spacing: 0.3em;
    margin-bottom: 2rem;
    background: rgba(201, 160, 80, 0.06);
  }
  .status-badge.closed { border-color: var(--bad); color: var(--bad); background: rgba(201, 160, 80, 0.1); }
  .status-badge::before {
    content: ''; width: 8px; height: 8px; border-radius: 50%;
    background: currentColor; box-shadow: 0 0 12px currentColor;
    animation: blink 2.5s ease-in-out infinite;
  }
